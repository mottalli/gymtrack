<svg viewBox="0 0 300 220" role="img" aria-labelledby="demo-title" aria-describedby="demo-description" xmlns="http://www.w3.org/2000/svg" width="300" height="220">
<title id="demo-title">Dumbbell Bench Press — front view</title>
<desc id="demo-description">Lower beside your chest, then press above your shoulders. Simplified front-view projection, not a precise guide to joint angles.</desc>
<path class="demo-floor" d="M28 202H272" fill="rgb(0, 0, 0)" stroke="rgb(203, 213, 235)" stroke-width="2px" stroke-linecap="butt" stroke-linejoin="miter"/>
<g class="demo-bench" fill="rgb(203, 214, 244)" stroke="rgb(156, 175, 217)" stroke-width="4px" stroke-linecap="round" stroke-linejoin="miter">
<rect x="116" y="145" width="68" height="13" rx="5"/>
<path d="M150 160V201M129 201H171"/>
</g>
<g class="demo-body" fill="rgb(50, 88, 230)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="round" stroke-linejoin="round">
<circle cx="150" cy="119" r="13"/>
<path d="M128 139Q150 133 172 139L168 165H132Z" stroke-width="6"/>
<path d="M137 163L115 177L110 198H94M163 163L185 177L190 198H206" fill="none" stroke-width="10"/>
</g>
<g class="demo-near-arm" fill="rgb(0, 0, 0)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<polyline points="126,138 96,148 96,112" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="126,138 96,148 96,112;126,138 125,104 124,70;126,138 125,104 124,70;126,138 96,148 96,112;126,138 96,148 96,112" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<g transform="translate(96 112)" class="demo-dumbbell" fill="rgb(37, 58, 89)" stroke="rgb(37, 58, 89)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<animateTransform attributeName="transform" type="translate" values="96 112;124 70;124 70;96 112;96 112" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
<path d="M-10 0H10" stroke-width="4"/>
<rect x="-14" y="-9" width="6" height="18" rx="2"/>
<rect x="8" y="-9" width="6" height="18" rx="2"/>
</g>
</g>
<g class="demo-near-arm" fill="rgb(0, 0, 0)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<polyline points="174,138 204,148 204,112" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="174,138 204,148 204,112;174,138 175,104 176,70;174,138 175,104 176,70;174,138 204,148 204,112;174,138 204,148 204,112" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<g transform="translate(204 112)" class="demo-dumbbell" fill="rgb(37, 58, 89)" stroke="rgb(37, 58, 89)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<animateTransform attributeName="transform" type="translate" values="204 112;176 70;176 70;204 112;204 112" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
<path d="M-10 0H10" stroke-width="4"/>
<rect x="-14" y="-9" width="6" height="18" rx="2"/>
<rect x="8" y="-9" width="6" height="18" rx="2"/>
</g>
</g>
</svg>
