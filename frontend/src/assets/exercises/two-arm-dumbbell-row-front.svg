<polyline points="140,139 128,168 125,198" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="140,139 128,168 125,198;140,139 128,168 125,198;140,139 128,168 125,198;140,139 128,168 125,198;140,139 128,168 125,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<polyline points="125,198 113,198" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
