<svg viewBox="0 0 300 220" role="img" aria-labelledby="demo-title" aria-describedby="demo-description" xmlns="http://www.w3.org/2000/svg" width="300" height="220">
<title id="demo-title">Seated Dumbbell Press — front view</title>
<desc id="demo-description">Press from shoulder height to overhead while keeping your torso steady. Simplified front-view projection, not a precise guide to joint angles.</desc>
<path class="demo-floor" d="M28 202H272" fill="rgb(0, 0, 0)" stroke="rgb(203, 213, 235)" stroke-width="2px" stroke-linecap="butt" stroke-linejoin="miter"/>
<g class="demo-bench" fill="rgb(203, 214, 244)" stroke="rgb(156, 175, 217)" stroke-width="4px" stroke-linecap="round" stroke-linejoin="miter">
<rect x="119" y="153" width="62" height="10" rx="4"/>
<path d="M129 164V200M171 164V200"/>
</g>
<g class="demo-body" fill="rgb(50, 88, 230)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="round" stroke-linejoin="round">
<g class="demo-leg demo-leg-0" opacity="1" fill="rgb(50, 88, 230)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="round" stroke-linejoin="round">
<polyline points="139,145 120,165 112,198" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="139,145 120,165 112,198;139,145 120,165 112,198;139,145 120,165 112,198;139,145 120,165 112,198;139,145 120,165 112,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<polyline points="112,198 100,198" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="112,198 100,198;112,198 100,198;112,198 100,198;112,198 100,198;112,198 100,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
</g>
<g class="demo-leg demo-leg-1" opacity="1" fill="rgb(50, 88, 230)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="round" stroke-linejoin="round">
<polyline points="161,145 180,165 188,198" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="161,145 180,165 188,198;161,145 180,165 188,198;161,145 180,165 188,198;161,145 180,165 188,198;161,145 180,165 188,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
