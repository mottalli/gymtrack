<animateTransform attributeName="transform" type="translate" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="4s" repeatCount="indefinite" values="144 139;144 139;144 139;144 139;144 139;118 77;118 77;144 139;144 139"/>
