<g>
<g class="demo-dumbbell" transform="translate(114 180)" fill="rgb(37, 58, 89)" stroke="rgb(37, 58, 89)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<animateTransform attributeName="transform" type="translate" values="114 180;158 130;158 130;114 180;114 180" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
<path d="M-10 0H10" stroke-width="4"/>
<rect x="-14" y="-9" width="6" height="18" rx="2"/>
<rect x="8" y="-9" width="6" height="18" rx="2"/>
