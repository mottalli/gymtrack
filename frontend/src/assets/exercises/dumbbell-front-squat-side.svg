<svg viewBox="0 0 300 220" role="img" aria-labelledby="demo-title" aria-describedby="demo-description" xmlns="http://www.w3.org/2000/svg" width="300" height="220">
<title id="demo-title">Dumbbell Front Squat — side view</title>
<desc id="demo-description">Keep the dumbbells at your shoulders. Bend at hips and knees, then stand. Simplified side-view projection; illustrative motion only.</desc>
