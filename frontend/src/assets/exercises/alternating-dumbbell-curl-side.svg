<svg viewBox="0 0 300 220" role="img" aria-labelledby="demo-title" aria-describedby="demo-description" xmlns="http://www.w3.org/2000/svg" width="300" height="220">
<title id="demo-title">Alternating Dumbbell Curl — side view</title>
<desc id="demo-description">Curl one arm at a time, keeping your upper arms still and avoiding a swing. Simplified side-view projection; illustrative motion only.</desc>
<path class="demo-floor" d="M28 202H272" fill="rgb(0, 0, 0)" stroke="rgb(203, 213, 235)" stroke-width="2px" stroke-linecap="butt" stroke-linejoin="miter"/>
<g class="demo-body" fill="rgb(50, 88, 230)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="round" stroke-linejoin="round">
<g class="demo-leg demo-leg-0" opacity="1" fill="rgb(50, 88, 230)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="round" stroke-linejoin="round">
<polyline points="148,126 145,164 145,198" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="148,126 145,164 145,198;148,126 145,164 145,198;148,126 145,164 145,198;148,126 145,164 145,198;148,126 145,164 145,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<polyline points="145,198 157,198" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="145,198 157,198;145,198 157,198;145,198 157,198;145,198 157,198;145,198 157,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
</g>
<g class="demo-leg demo-leg-1" opacity="0.45" fill="rgb(50, 88, 230)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="round" stroke-linejoin="round">
<polyline points="148,126 158,163 160,198" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="148,126 158,163 160,198;148,126 158,163 160,198;148,126 158,163 160,198;148,126 158,163 160,198;148,126 158,163 160,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<polyline points="160,198 172,198" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="160,198 172,198;160,198 172,198;160,198 172,198;160,198 172,198;160,198 172,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
</g>
<polyline points="140,62 148,126" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="140,62 148,126;140,62 148,126;140,62 148,126;140,62 148,126;140,62 148,126" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<polyline points="138,38 140,62" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="138,38 140,62;138,38 140,62;138,38 140,62;138,38 140,62;138,38 140,62" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<circle cx="138" cy="38" r="12">
<animate attributeName="cx" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite" values="138;138;138;138;138"/>
<animate attributeName="cy" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite" values="38;38;38;38;38"/>
