<animate attributeName="points" values="103,104 108,140 113,178;103,104 150,94 153,131;103,104 150,94 153,131;103,104 108,140 113,178;103,104 108,140 113,178" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
</g>
<g class="demo-body" fill="rgb(50, 88, 230)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="round" stroke-linejoin="round">
