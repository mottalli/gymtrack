<svg viewBox="0 0 300 220" role="img" aria-labelledby="demo-title" aria-describedby="demo-description" xmlns="http://www.w3.org/2000/svg" width="300" height="220">
<title id="demo-title">Dumbbell Bench Press — side view</title>
<desc id="demo-description">Lower beside your chest, then press above your shoulders. Simplified side-view projection; illustrative motion only.</desc>
<path class="demo-floor" d="M28 202H272" fill="rgb(0, 0, 0)" stroke="rgb(203, 213, 235)" stroke-width="2px" stroke-linecap="butt" stroke-linejoin="miter"/>
<g class="demo-bench" fill="rgb(203, 214, 244)" stroke="rgb(156, 175, 217)" stroke-width="4px" stroke-linecap="round" stroke-linejoin="miter">
<rect x="49" y="143" width="140" height="12" rx="5"/>
<path d="M68 156V200M173 156V200M56 201H80M161 201H185"/>
</g>
<g class="demo-far-arm" transform="translate(-9 -5)" fill="rgb(0, 0, 0)" stroke="rgb(154, 175, 234)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<polyline points="96,126 128,145 128,111" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="96,126 128,145 128,111;96,126 96,95 96,64;96,126 96,95 96,64;96,126 128,145 128,111;96,126 128,145 128,111" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<g transform="translate(128 111)" class="demo-dumbbell" fill="rgb(115, 133, 171)" stroke="rgb(115, 133, 171)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<animateTransform attributeName="transform" type="translate" values="128 111;96 64;96 64;128 111;128 111" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
<path d="M-10 0H10" stroke-width="4"/>
<rect x="-14" y="-9" width="6" height="18" rx="2"/>
<rect x="8" y="-9" width="6" height="18" rx="2"/>
</g>
</g>
<g class="demo-body" fill="rgb(50, 88, 230)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="round" stroke-linejoin="round">
<circle cx="64" cy="127" r="13"/>
<path d="M82 131L98 130L163 136" stroke-width="13"/>
<path d="M163 136L207 155L215 197H233" stroke-width="10"/>
<path d="M157 137L190 162L195 197H211" stroke-width="8" opacity=".45"/>
</g>
<g class="demo-near-arm" fill="rgb(0, 0, 0)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<polyline points="96,126 128,145 128,111" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="96,126 128,145 128,111;96,126 96,95 96,64;96,126 96,95 96,64;96,126 128,145 128,111;96,126 128,145 128,111" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<g transform="translate(128 111)" class="demo-dumbbell" fill="rgb(37, 58, 89)" stroke="rgb(37, 58, 89)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<animateTransform attributeName="transform" type="translate" values="128 111;96 64;96 64;128 111;128 111" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
<path d="M-10 0H10" stroke-width="4"/>
<rect x="-14" y="-9" width="6" height="18" rx="2"/>
<rect x="8" y="-9" width="6" height="18" rx="2"/>
</g>
</g>
</svg>
