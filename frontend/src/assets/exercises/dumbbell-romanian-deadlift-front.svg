<rect x="-14" y="-9" width="6" height="18" rx="2"/>
<rect x="8" y="-9" width="6" height="18" rx="2"/>
</g>
</g>
<g>
<g class="demo-dumbbell" transform="translate(180 140)" fill="rgb(37, 58, 89)" stroke="rgb(37, 58, 89)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<animateTransform attributeName="transform" type="translate" values="180 140;184 178;184 178;180 140;180 140" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
