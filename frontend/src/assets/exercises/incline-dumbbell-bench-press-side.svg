<svg viewBox="0 0 300 220" role="img" aria-labelledby="demo-title" aria-describedby="demo-description" xmlns="http://www.w3.org/2000/svg" width="300" height="220">
<title id="demo-title">Incline Dumbbell Bench Press (45 deg.) — side view</title>
<desc id="demo-description">Use a 45° bench. Lower with control, then press above your shoulders. Simplified side-view projection; illustrative motion only.</desc>
