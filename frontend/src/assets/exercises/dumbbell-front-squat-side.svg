<polyline points="140,62 167,94 149,65" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="140,62 167,94 149,65;137,105 167,129 146,104;137,105 167,129 146,104;140,62 167,94 149,65;140,62 167,94 149,65" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<g class="demo-dumbbell" transform="translate(149 65)" fill="rgb(115, 133, 171)" stroke="rgb(115, 133, 171)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<animateTransform attributeName="transform" type="translate" values="149 65;146 104;146 104;149 65;149 65" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
