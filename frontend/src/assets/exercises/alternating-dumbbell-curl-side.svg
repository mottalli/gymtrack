<animateTransform attributeName="transform" type="translate" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="4s" repeatCount="indefinite" values="135 139;109 77;109 77;135 139;135 139;135 139;135 139;135 139;135 139"/>
<path d="M-10 0H10" stroke-width="4"/>
<rect x="-14" y="-9" width="6" height="18" rx="2"/>
