<svg viewBox="0 0 300 220" role="img" aria-labelledby="demo-title" aria-describedby="demo-description" xmlns="http://www.w3.org/2000/svg" width="300" height="220">
<title id="demo-title">Deadlift — front view</title>
<desc id="demo-description">Keep the bar close. Push through the floor and stand tall without leaning back. Simplified front-view projection, not a precise guide to joint angles.</desc>
