<svg viewBox="0 0 300 220" role="img" aria-labelledby="demo-title" aria-describedby="demo-description" xmlns="http://www.w3.org/2000/svg" width="300" height="220">
<title id="demo-title">Dumbbell Romanian Deadlift — side view</title>
<desc id="demo-description">Keep a soft knee bend. Move your hips back with weights close, then stand. Simplified side-view projection; illustrative motion only.</desc>
