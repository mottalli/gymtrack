<animate attributeName="points" values="150,64 150,128;150,110 150,139;150,110 150,139;150,64 150,128;150,64 150,128" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<polyline points="130,65 170,65" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="130,65 170,65;130,109 170,109;130,109 170,109;130,65 170,65;130,65 170,65" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
