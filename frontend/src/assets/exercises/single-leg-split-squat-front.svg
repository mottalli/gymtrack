<svg viewBox="0 0 300 220" role="img" aria-labelledby="demo-title" aria-describedby="demo-description" xmlns="http://www.w3.org/2000/svg" width="300" height="220">
<title id="demo-title">Single Leg Split Squat (Dumbbell) — front view</title>
<desc id="demo-description">With your rear foot supported, lower straight down and push through the front foot. Repeat both sides. Simplified front-view projection, not a precise guide to joint angles.</desc>
