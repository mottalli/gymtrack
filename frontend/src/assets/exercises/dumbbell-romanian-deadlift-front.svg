<g class="demo-leg demo-leg-0" opacity="1" fill="rgb(50, 88, 230)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="round" stroke-linejoin="round">
<polyline points="140,128 130,164 125,198" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="140,128 130,164 125,198;140,139 128,168 125,198;140,139 128,168 125,198;140,128 130,164 125,198;140,128 130,164 125,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<polyline points="125,198 113,198" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="125,198 113,198;125,198 113,198;125,198 113,198;125,198 113,198;125,198 113,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
</g>
<g class="demo-leg demo-leg-1" opacity="1" fill="rgb(50, 88, 230)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="round" stroke-linejoin="round">
<polyline points="160,128 170,164 175,198" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="160,128 170,164 175,198;160,139 172,168 175,198;160,139 172,168 175,198;160,128 170,164 175,198;160,128 170,164 175,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<polyline points="175,198 187,198" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="175,198 187,198;175,198 187,198;175,198 187,198;175,198 187,198;175,198 187,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
</g>
