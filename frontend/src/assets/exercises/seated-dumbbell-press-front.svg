<polyline points="172,84 200,108 200,70" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="172,84 200,108 200,70;172,84 172,51 172,18;172,84 172,51 172,18;172,84 200,108 200,70;172,84 200,108 200,70" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
