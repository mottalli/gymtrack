<animateTransform attributeName="transform" type="translate" values="102 180;122 139;122 139;102 180;102 180" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
<path d="M-10 0H10" stroke-width="4"/>
