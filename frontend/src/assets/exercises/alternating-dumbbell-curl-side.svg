<animate attributeName="points" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="4s" repeatCount="indefinite" values="140,62 138,102 135,139;140,62 138,102 109,77;140,62 138,102 109,77;140,62 138,102 135,139;140,62 138,102 135,139;140,62 138,102 135,139;140,62 138,102 135,139;140,62 138,102 135,139;140,62 138,102 135,139"/>
</polyline>
