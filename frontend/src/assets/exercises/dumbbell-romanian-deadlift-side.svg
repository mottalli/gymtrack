<polyline points="140,62 138,102 135,139" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="140,62 138,102 135,139;103,104 108,140 113,178;103,104 108,140 113,178;140,62 138,102 135,139;140,62 138,102 135,139" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<g class="demo-dumbbell" transform="translate(135 139)" fill="rgb(115, 133, 171)" stroke="rgb(115, 133, 171)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<animateTransform attributeName="transform" type="translate" values="135 139;113 178;113 178;135 139;135 139" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
<path d="M-10 0H10" stroke-width="4"/>
<rect x="-14" y="-9" width="6" height="18" rx="2"/>
<rect x="8" y="-9" width="6" height="18" rx="2"/>
</g>
</g>
