<rect x="207" y="153" width="37" height="10" rx="4"/>
<path d="M217 164V200M234 164V200"/>
</g>
<g class="demo-far-arm" transform="translate(8 -4)" fill="rgb(0, 0, 0)" stroke="rgb(154, 175, 234)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<polyline points="147,77 143,112 142,148" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="147,77 143,112 142,148;140,115 136,149 135,184;140,115 136,149 135,184;147,77 143,112 142,148;147,77 143,112 142,148" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
