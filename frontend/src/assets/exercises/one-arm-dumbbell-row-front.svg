<animate attributeName="points" values="166,141 197,166 209,198;166,141 197,166 209,198;166,141 197,166 209,198;166,141 197,166 209,198;166,141 197,166 209,198" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
