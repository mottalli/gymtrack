</polyline>
</g>
<polyline points="150,83 150,145" fill="none" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="150,83 150,145;150,83 150,145;150,83 150,145;150,83 150,145;150,83 150,145" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
<polyline points="128,84 172,84" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="128,84 172,84;128,84 172,84;128,84 172,84;128,84 172,84;128,84 172,84" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
