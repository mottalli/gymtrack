<animate attributeName="cy" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite" values="89;89;89;89;89"/>
</circle>
</g>
<g class="demo-near-arm" fill="rgb(0, 0, 0)" stroke="rgb(50, 88, 230)" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter">
<polyline points="106,106 111,143 114,180" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="106,106 111,143 114,180;106,106 154,94 158,130;106,106 154,94 158,130;106,106 111,143 114,180;106,106 111,143 114,180" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
