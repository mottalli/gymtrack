<polyline points="148,141 163,155 175,156" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<animate attributeName="points" values="148,141 163,155 175,156;148,141 163,155 175,156;148,141 163,155 175,156;148,141 163,155 175,156;148,141 163,155 175,156" keyTimes="0;0.4;0.5;0.9;1" dur="4s" repeatCount="indefinite"/>
</polyline>
